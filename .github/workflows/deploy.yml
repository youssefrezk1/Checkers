name: Build and Deploy Checkers to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "350769147036"
  ECR_REPOSITORY: checkers
  EKS_CLUSTER_NAME: checkers-eks
  K8S_DEPLOYMENT: checkers-deployment
  K8S_CONTAINER: checkers

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::350769147036:role/GitHubActions-Checkers-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: 350769147036.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building:"
          echo "${IMAGE}"

          docker build -t "${IMAGE}" .

          docker push "${IMAGE}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify EKS access
        run: |
          set -e

          kubectl cluster-info
          kubectl get nodes

      - name: Apply Kubernetes manifests
        run: |
          set -e

          kubectl apply -f k8s/ingressclass.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Deploy exact Git SHA image
        env:
          ECR_REGISTRY: 350769147036.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Deploying image:"
          echo "${IMAGE}"

          kubectl set image \
            deployment/"${K8S_DEPLOYMENT}" \
            "${K8S_CONTAINER}"="${IMAGE}"

      - name: Wait for deployment rollout
        run: |
          set -e

          kubectl rollout status \
            deployment/"${K8S_DEPLOYMENT}" \
            --timeout=5m

      - name: Verify deployment
        run: |
          set -e

          echo "===== DEPLOYMENT ====="
          kubectl get deployment "${K8S_DEPLOYMENT}" -o wide

          echo
          echo "===== PODS ====="
          kubectl get pods -l app=checkers -o wide

          echo
          echo "===== SERVICE ====="
          kubectl get svc checkers-service -o wide

          echo
          echo "===== INGRESS ====="
          kubectl get ingress checkers-ingress -o wide

          echo
          echo "===== IMAGE ====="
          kubectl get deployment "${K8S_DEPLOYMENT}" \
            -o jsonpath='{range .spec.template.spec.containers[*]}name={.name} image={.image}{"\n"}{end}'

      - name: Wait for ALB address
        run: |
          set -e

          echo "Waiting for ALB address..."

          for i in {1..30}; do
            ALB_DNS=$(kubectl get ingress checkers-ingress \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            if [ -n "${ALB_DNS}" ]; then
              echo
              echo "======================================"
              echo "CHECKERS URL"
              echo "http://${ALB_DNS}/"
              echo "======================================"

              echo "CHECKERS_URL=http://${ALB_DNS}/" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "ALB not ready yet..."
            sleep 10
          done

          echo "ERROR: ALB address was not assigned within 5 minutes."
          kubectl describe ingress checkers-ingress
          exit 1

      - name: Final health verification
        run: |
          set -e

          echo "===== FINAL INGRESS ====="
          kubectl get ingress checkers-ingress -o wide

          echo
          echo "===== FINAL PODS ====="
          kubectl get pods -l app=checkers -o wide

          echo
          echo "===== FINAL IMAGE ====="
          kubectl get deployment "${K8S_DEPLOYMENT}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
