name: Build and Deploy Checkers

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::350769147036:role/GitHubActions-Checkers-Deploy
  DOCKER_IMAGE: youssefrezk1/checkers

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t "${DOCKER_IMAGE}:${GITHUB_SHA}" \
            -t "${DOCKER_IMAGE}:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${DOCKER_IMAGE}:${GITHUB_SHA}"
          docker push "${DOCKER_IMAGE}:latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core boto3 botocore
          ansible-galaxy collection install amazon.aws community.docker

      - name: Test SSM connection
        working-directory: ansible
        run: ansible checkers-vm -m ping

      - name: Deploy with Ansible
        working-directory: ansible
        run: |
          ansible-playbook setup.yml \
            -e "docker_image=${DOCKER_IMAGE}" \
            -e "image_tag=${GITHUB_SHA}"
