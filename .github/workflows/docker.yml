name: CI/CD + DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::350769147036:role/GitHubActions-Checkers-Deploy
  DOCKER_IMAGE: youssefrezk1/checkers

jobs:

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  bandit:
    needs: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Scan
        run: |
          mkdir -p reports
          bandit -r . -ll -x checkers/baseline_eval -f txt -o reports/bandit-report.txt

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit-report.txt


  test:
    needs: bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: |
          pytest


  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t "${DOCKER_IMAGE}:latest" .


  trivy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t "${DOCKER_IMAGE}:latest" .

      - name: Create reports directory
        run: mkdir -p reports

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:latest"
          format: "table"
          output: "reports/trivy-report.txt"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/trivy-report.txt


  docker-push:
    needs: trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build --no-cache -t "${DOCKER_IMAGE}:latest" .
          docker tag "${DOCKER_IMAGE}:latest" "${DOCKER_IMAGE}:${GITHUB_SHA}"

      - name: Push Docker image
        run: |
          docker push "${DOCKER_IMAGE}:latest"
          docker push "${DOCKER_IMAGE}:${GITHUB_SHA}"


  deploy:
    needs: docker-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core boto3 botocore
          ansible-galaxy collection install amazon.aws community.docker

      - name: Verify Ansible
        run: |
          ansible --version
          ansible-galaxy collection list

      - name: Test SSM connection
        working-directory: ansible
        run: |
          ansible checkers-vm -m ping

      - name: Deploy with Ansible
        working-directory: ansible
        run: |
          ansible-playbook setup.yml \
            -e "docker_image=${DOCKER_IMAGE}" \
            -e "image_tag=${GITHUB_SHA}"


  notify:
    needs: deploy
    runs-on: ubuntu-latest

    if: always()

    steps:
      - name: Download Bandit Report
        uses: actions/download-artifact@v4
        with:
          name: bandit-report
          path: reports

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report
          path: reports

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: "Checkers DevSecOps Pipeline Completed"

          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}

          attachments: |
            reports/bandit-report.txt
            reports/trivy-report.txt

          body: |
            Checkers DevSecOps Pipeline Completed

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Workflow:
            ${{ github.workflow }}

            Pipeline:
            ✔ Gitleaks
            ✔ Bandit
            ✔ Pytest
            ✔ Docker Build
            ✔ Trivy
            ✔ Docker Push
            ✔ AWS OIDC
            ✔ Ansible
            ✔ AWS SSM
            ✔ EC2 Deployment

            Workflow Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
